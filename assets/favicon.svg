<svg width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="rw-title rw-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="rw-title">Rayo Washing Animado</title>
  <desc id="rw-desc">Rayo electrizante 3D con chispas titilantes, burbujas flotantes y destellos de lavado</desc>

  <defs>
    <style>
      @keyframes rw-spark-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 3px #FFE20A); }
      }
      @keyframes rw-bubble-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes rw-star-twinkle {
        0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.7; }
        50% { transform: scale(1.25) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 4px #FFFFFF); }
      }
      .rw-spark { transform-origin: center; animation: rw-spark-pulse 1.8s ease-in-out infinite; }
      .rw-spark-delay { transform-origin: center; animation: rw-spark-pulse 1.8s ease-in-out infinite 0.9s; }
      .rw-bubble { transform-origin: center; animation: rw-bubble-bob 2.4s ease-in-out infinite; }
      .rw-star-1 { transform-origin: 42px 63.5px; animation: rw-star-twinkle 2s ease-in-out infinite; }
      .rw-star-2 { transform-origin: 109px 2.5px; animation: rw-star-twinkle 2s ease-in-out infinite 1s; }
      .rw-star-3 { transform-origin: 78px 37px; animation: rw-star-twinkle 2.5s ease-in-out infinite 0.5s; }
    </style>

    <linearGradient id="rw-yellow-light" x1="40" y1="5" x2="95" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFF76"/>
      <stop offset="25%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <linearGradient id="rw-yellow-shade" x1="60" y1="20" x2="115" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFAE00"/>
      <stop offset="50%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#F14200"/>
    </linearGradient>

    <linearGradient id="rw-red-body" x1="42" y1="5" x2="120" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5338"/>
      <stop offset="45%" stop-color="#E9220D"/>
      <stop offset="100%" stop-color="#9E0700"/>
    </linearGradient>

    <linearGradient id="rw-wave-top" x1="8" y1="40" x2="78" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3EF8FF"/>
      <stop offset="55%" stop-color="#16C7D5"/>
      <stop offset="100%" stop-color="#0298AB"/>
    </linearGradient>

    <linearGradient id="rw-wave-mid" x1="6" y1="65" x2="84" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C4FF"/>
      <stop offset="45%" stop-color="#0877B9"/>
      <stop offset="100%" stop-color="#034878"/>
    </linearGradient>

    <linearGradient id="rw-wave-bot" x1="10" y1="88" x2="80" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3EF8FF"/>
      <stop offset="50%" stop-color="#16C7D5"/>
      <stop offset="100%" stop-color="#0877B9"/>
    </linearGradient>

    <radialGradient id="rw-bubble-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E0FBFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#26E8F7" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#0877B9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#054A75" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- AGUA Y OLAS -->
  <g id="waves-layer" stroke-linecap="round">
    <path d="M8 45c11-9 22 9 34 0s23 9 35 0" stroke="#09141F" stroke-width="14" fill="none"/>
    <path d="M8 45c11-9 22 9 34 0s23 9 35 0" stroke="url(#rw-wave-top)" stroke-width="8" fill="none"/>
    <path d="M11 42.5c8.5-7 17 4 25.5-1" stroke="#FFFFFF" stroke-width="2.6" fill="none" opacity="0.95"/>
    <path d="M45.5 42.5c8-6 17 4 25.5-1" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.85"/>

    <path d="M6 68c12-10 24 10 37 0s25 10 38 0" stroke="#09141F" stroke-width="14" fill="none"/>
    <path d="M6 68c12-10 24 10 37 0s25 10 38 0" stroke="url(#rw-wave-mid)" stroke-width="8" fill="none"/>
    <path d="M10 65.5c11-8.5 22 5 33.5-1" stroke="#71EDFF" stroke-width="2.4" fill="none" opacity="0.9"/>
    <path d="M48 65.5c10.5-7 21.5 5 32.5-1" stroke="#71EDFF" stroke-width="1.8" fill="none" opacity="0.8"/>

    <path d="M11 91c10-8 21 8 32 0s22 8 34 0" stroke="#09141F" stroke-width="14" fill="none"/>
    <path d="M11 91c10-8 21 8 32 0s22 8 34 0" stroke="url(#rw-wave-bot)" stroke-width="8" fill="none"/>
    <path d="M14 88.5c8-6 16.5 4 24.5-1" stroke="#FFFFFF" stroke-width="2.6" fill="none" opacity="0.92"/>
    <path d="M46.5 88.5c8-5 17 4 25-1" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Gotas -->
    <path d="M23 27 C23 25, 26 20.5, 26 20.5 C26 20.5, 29 25, 29 27 C29 29.5, 27.6 31, 26 31 C24.4 31, 23 29.5, 23 27 Z" fill="#2EE7F7" stroke="#09141F" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="25.2" cy="25.8" r="1.1" fill="#FFFFFF"/>
    <path d="M17 76 C17 74.5, 19.5 71, 19.5 71 C19.5 71, 22 74.5, 22 76 C22 77.8, 20.8 79, 19.5 79 C18.2 79, 17 77.8, 17 76 Z" fill="#2EE7F7" stroke="#09141F" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="18.8" cy="75.2" r="0.8" fill="#FFFFFF"/>
    <circle cx="43" cy="111" r="3.2" fill="#2EE7F7" stroke="#09141F" stroke-width="2"/>
    <circle cx="42" cy="110" r="1.1" fill="#FFFFFF"/>
    <circle cx="75" cy="38" r="2.2" fill="#2EE7F7" stroke="#09141F" stroke-width="1.6"/>
    <circle cx="74.2" cy="37.2" r="0.7" fill="#FFFFFF"/>

    <!-- Burbujas con animación flotante -->
    <g class="rw-bubble">
      <circle cx="15" cy="56" r="4.8" fill="url(#rw-bubble-grad)" stroke="#09141F" stroke-width="1.8"/>
      <path d="M13.2 53.8 A2.6 2.6 0 0 1 17 53.2" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    </g>
    <circle cx="28" cy="102" r="3.3" fill="url(#rw-bubble-grad)" stroke="#09141F" stroke-width="1.6"/>
    <circle cx="26.8" cy="100.8" r="0.8" fill="#FFFFFF"/>
  </g>

  <!-- RAYO -->
  <g id="lightning-layer">
    <path d="M88 5 L42 67 H70 L52 124 L120 48 H87 L109 5 Z" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M88 5 L42 67 H70 L52 124 L120 48 H87 L109 5 Z" fill="#FF4D35" stroke="#09141F" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M88 5 L42 67 H70 L52 124 L120 48 H87 L109 5 Z" fill="url(#rw-red-body)"/>
    <path d="M88 5 L42 67 H70 L52 124 L66 109 L78 69 H56 L94 14 Z" fill="#680400" opacity="0.32"/>

    <path d="M89 9.5 L50 62.5 H77 L56.5 116 L111 52.5 H81 L102.5 9.5 Z" fill="#09141F" stroke="#09141F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M96 9.5 L102.5 9.5 L81 52.5 L111 52.5 L56.5 116 L70 70 L91 46 Z" fill="url(#rw-yellow-shade)"/>
    <path d="M89 9.5 L96 9.5 L91 46 L70 70 L56.5 116 L77 62.5 H50 L89 9.5 Z" fill="url(#rw-yellow-light)"/>

    <path d="M89 13 L56 60.5 H72 L66 76 L70 73 L75 62 H59 L91.5 13 Z" fill="#FFFFFF" opacity="0.92"/>
    <polygon points="58,107 57,114 62,103 61,100" fill="#FFFFFF" opacity="0.85"/>
    <polygon points="99,13 102,13 89,49 86,49" fill="#FFF275" opacity="0.7"/>

    <!-- Chispas eléctricas animadas -->
    <g class="rw-spark">
      <path d="M116 33 L123 28 L120 28 L125 21 L118 25 L120 25 Z" fill="#FFE20A" stroke="#09141F" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g class="rw-spark-delay">
      <path d="M38 116 L31 121 L34 121 L29 127 L36 123 L34 123 Z" fill="#FFE20A" stroke="#09141F" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <path d="M45 64 L41 68 L44 69 L39 74" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Destellos animados (giran y brillan suavemente) -->
    <path class="rw-star-1" d="M42 67 Q42 63.5 39 63.5 Q42 63.5 42 60 Q42 63.5 45 63.5 Q42 63.5 42 67 Z" fill="#FFFFFF"/>
    <path class="rw-star-2" d="M109 6 Q109 2.5 106 2.5 Q109 2.5 109 -1 Q109 2.5 112 2.5 Q109 2.5 109 6 Z" fill="#FFFFFF"/>
    <circle cx="109" cy="2.5" r="1.1" fill="#FFE20A"/>
    <path class="rw-star-3" d="M78 40 Q78 37 75 37 Q78 37 78 34 Q78 37 81 37 Q78 37 78 40 Z" fill="#FFFFFF"/>
  </g>
</svg>
